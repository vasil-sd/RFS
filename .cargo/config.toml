# Project-specific tool-path defaults live in env.toml (included below) so the
# machine-specific values stay out of this file and out of source. Rationale:
# Phase 12 portability, TOOLCHAIN.md section 8.
include = ["env.toml"]

[alias]
build-training = "run --bin build_training --"
extract-training-snippets = "run --bin extract_training_snippets --"
test-training = "test training"
generate-code-tests = "run --bin generate_code_tests --"
test-generated-code = "run --bin test_generated_code --"
parse = "run -- parse"
validate = "run -- validate"
codegen = "run -- codegen"
