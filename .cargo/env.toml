# Phase 12 portability defaults - pulled into .cargo/config.toml by its
# top-level `include` directive (cargo reference: "Including extra
# configuration files"). These are the tool locations that are specific to THIS
# project setup and not derivable from the crate tree or a standard PATH name -
# currently just the project-local z3 install (a sibling of the repo, outside
# it). Every other tool resolves via RFS_* / standard env vars / bare name on
# PATH with no default baked into source.
#
# These [env] values are NON-FORCING: a real environment variable of the same
# name always wins, so on NixOS (or anywhere) you override or unset them and the
# resolvers fall through to pkg-config / PATH. Each value is also existence-
# checked by its resolver before use, so a stale default on a foreign system is
# skipped rather than trusted. See TOOLCHAIN.md section 8.
[env]
RFS_Z3_DIR = "/workspace/host/z3"
