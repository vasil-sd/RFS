# Phase 5 task 1: the repository is a cargo WORKSPACE. The root package
# (`rfs`, the toolchain) is an implicit member; `crates/*` holds the helper
# crates (rfs-build, rfs-adapters from tasks 1/11) and `crates/examples/*`
# the example crates (sync_handler/async_handler from task 11).
[workspace]
# Explicit list (not globs): `crates/examples` itself has no manifest, and
# the C example projects (c_sync_handler, fuzz_c - Phase 5 task 12) are
# Makefile-driven and NOT cargo members.
members = [
    "crates/rfs-build",
    "crates/rfs-adapters",
    "crates/examples/sync_handler",
    "crates/examples/async_handler",
    "crates/examples/fuzz_rust",
]

[package]
name = "rfs"
version = "1.0.0"
edition = "2021"
default-run = "rfs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Phase 4 task 11 (optional): SMT bounded mode. The generated binaries link
# libz3 directly (C API); this crate dep is used by the feature-gated tests
# for solver-environment sanity checks. Default build is unaffected.
smt = ["dep:z3"]

[dependencies]
nom = "8.0.0"
z3 = { version = "0.21", optional = true }
# Phase 7 task 1: pure-Rust mermaid SVG rendering for `rfs diagram --render svg`
# (the default renderer). The docs gate (tests/docs_md_test.rs) uses it too.
mermaid-rs-renderer = { version = "0.3", default-features = false }
# Phase 7 task 2: pure-Rust PlantUML SVG rendering for `rfs diagram --render svg`
# (the default renderer). NOT on crates.io - pinned to a commit of the upstream
# workspace repo; cargo caches the checkout under $CARGO_HOME/git, so rebuilds
# work offline after the first fetch (D-P7-3).
plantuml-core = { git = "https://github.com/askidmobile/PlantUML_RUST", rev = "8066f6124a86ed5da59c6d7d570f0568891c378e" }
# Phase 7 task 3: pure-Rust Graphviz DOT SVG rendering for `rfs diagram --render svg`
# (the default renderer). A port of graphviz's dot layout; its optional `log`
# dependency is not enabled.
layout-rs = "0.1"
# Phase 7 task 5: railroad-diagram SVG rendering for `rfs info format spec-rfs
# --output svg`. The default `resvg` feature only matters for PNG output; we
# emit SVG strings only, so it stays off.
railroad = { version = "0.3", default-features = false }

[dev-dependencies]
chumsky = "0.13"
comrak = { version = "0.55", default-features = false }
