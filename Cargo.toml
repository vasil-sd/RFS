[package]
name = "rfs"
version = "0.1.0"
edition = "2021"
default-run = "rfs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Phase 4 task 11 (optional): SMT bounded mode. The generated binaries link
# libz3 directly (C API); this crate dep is used by the feature-gated tests
# for solver-environment sanity checks. Default build is unaffected.
smt = ["dep:z3"]

[dependencies]
nom = "8.0.0"
z3 = { version = "0.21", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
chumsky = "0.13"
