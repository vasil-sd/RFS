# Phase 5 task 1: the repository is a cargo WORKSPACE. The root package
# (`rfs`, the toolchain) is an implicit member; `crates/*` holds the helper
# crates (rfs-build, rfs-adapters from tasks 1/11) and `crates/examples/*`
# the example crates (sync_handler/async_handler from task 11).
[workspace]
# Explicit list (not a bare `crates/*` glob): `crates/examples` itself has no
# manifest, and the examples are members via their own glob.
members = [
    "crates/rfs-build",
    "crates/rfs-adapters",
    "crates/examples/*",
]

[package]
name = "rfs"
version = "0.1.0"
edition = "2021"
default-run = "rfs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Phase 4 task 11 (optional): SMT bounded mode. The generated binaries link
# libz3 directly (C API); this crate dep is used by the feature-gated tests
# for solver-environment sanity checks. Default build is unaffected.
smt = ["dep:z3"]

[dependencies]
nom = "8.0.0"
z3 = { version = "0.21", optional = true }

[dev-dependencies]
chumsky = "0.13"
