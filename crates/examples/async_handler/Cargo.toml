# Phase 5 task 11 example: drive the generated sliding-window ARQ sender
# (spec 43) as a futures Stream via the rfs-adapters async adapter. The FSM
# is generated at build time by rfs-build with the opt-in --with-protocol-fsm
# flag. `futures` is confined to this crate + rfs-adapters (never the rfs
# toolchain or generated code).
[package]
name = "async_handler"
version = "0.1.0"
edition = "2021"

[dependencies]
rfs-adapters = { path = "../../rfs-adapters", features = ["async"] }
futures = "0.3"

[build-dependencies]
rfs-build = { path = "../../rfs-build" }
